name: Continuous Integration & Security Suite

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Typecheck TypeScript
        run: npm run typecheck

      - name: Run ESLint
        run: npm run lint

      - name: Run Vitest Unit Tests
        run: npm run test:unit

      - name: Run Database Invariant Tests
        env:
          NEXT_PUBLIC_SUPABASE_URL: http://localhost:5432
          SUPABASE_SERVICE_ROLE_KEY: mock-service-key-for-ci
        run: npm run test:db
