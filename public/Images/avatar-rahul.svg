<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400" role="img">
<defs>
<linearGradient id="bg-rahul" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#dbeafe"/><stop offset="1" stop-color="#bfdbfe"/></linearGradient>
<linearGradient id="cloth-rahul" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2563eb"/><stop offset="1" stop-color="#1d4ed8"/></linearGradient>
<clipPath id="frame-rahul"><rect width="400" height="400"/></clipPath>
</defs>
<g clip-path="url(#frame-rahul)">
  <rect width="400" height="400" fill="url(#bg-rahul)"/>

  <!-- shoulders / bust -->
  <path d="M200 268 c-64 0 -116 40 -132 96 -4 14 -6 26 -6 36 h276 c0 -10 -2 -22 -6 -36 -16 -56 -68 -96 -132 -96 z" fill="url(#cloth-rahul)"/>
  <!-- collar shadow -->
  <path d="M200 268 c-20 0 -39 4 -55 12 l55 40 55 -40 c-16 -8 -35 -12 -55 -12 z" fill="#1d4ed8" opacity="0.55"/>

  <!-- neck -->
  <path d="M175 232 h50 v40 c0 14 -50 14 -50 0 z" fill="#a86f34"/>

  <!-- head -->
  <ellipse cx="200" cy="176" rx="66" ry="76" fill="#c68642"/>
  <!-- ears -->
  <ellipse cx="134" cy="182" rx="11" ry="15" fill="#a86f34"/>
  <ellipse cx="266" cy="182" rx="11" ry="15" fill="#a86f34"/>

  <!-- hair (base cap) -->
  <path d="M200 96 c-44 0 -70 30 -70 68 0 10 2 20 5 27 3 -22 8 -36 15 -43 14 -14 34 -18 50 -18 16 0 36 4 50 18 7 7 12 21 15 43 3 -7 5 -17 5 -27 0 -38 -26 -68 -70 -68 z" fill="#1f2937"/>

  <!-- brows -->
  <path d="M168 164 q14 -8 28 -1" stroke="#111827" stroke-width="7" fill="none" stroke-linecap="round"/>
  <path d="M204 163 q14 -7 28 1" stroke="#111827" stroke-width="7" fill="none" stroke-linecap="round"/>

  <!-- eyes -->
  <circle cx="180" cy="184" r="6.5" fill="#1f2937"/>
  <circle cx="220" cy="184" r="6.5" fill="#1f2937"/>
  <circle cx="182" cy="182" r="2.2" fill="#ffffff"/>
  <circle cx="222" cy="182" r="2.2" fill="#ffffff"/>

  <!-- nose + smile -->
  <path d="M200 192 q-5 12 2 16" stroke="#a86f34" stroke-width="5" fill="none" stroke-linecap="round"/>
  <path d="M182 218 q18 15 36 0" stroke="#9a3412" stroke-width="6" fill="none" stroke-linecap="round"/>

  
  <!-- mandarin collar -->
  <path d="M168 288 l32 24 32 -24" stroke="#eff6ff" stroke-width="7" fill="none" stroke-linejoin="round"/>
</g>
</svg>