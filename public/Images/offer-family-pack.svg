  <circle cx="456" cy="128" r="24" fill="#2563eb" opacity="0.72"/>
  <circle cx="456" cy="120" r="8" fill="#ffffff"/>
  <path d="M444 140 c0 -8 5 -13 12 -13 c7 0 12 5 12 13 z" fill="#ffffff"/>
