<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#e8f2ff"/><stop offset="1" stop-color="#b6d4ff"/></linearGradient>
  <radialGradient id="rice" cx="0.42" cy="0.34" r="0.72"><stop offset="0" stop-color="#fde8b8"/><stop offset="1" stop-color="#e8c07a"/></radialGradient>
  <filter id="sh" x="-25%" y="-25%" width="150%" height="150%">
    <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#7c4a1e" flood-opacity="0.22"/>
  </filter>
</defs>
<rect width="800" height="600" fill="url(#bg)"/>

<g filter="url(#sh)">
  <!-- shared platter -->
  <ellipse cx="400" cy="330" rx="248" ry="196" fill="#ffffff"/>
  <ellipse cx="400" cy="330" rx="226" ry="176" fill="#f4f6f8"/>

  <!-- central biryani mound -->
  <ellipse cx="400" cy="322" rx="128" ry="100" fill="url(#rice)"/>
  <!-- fried onion strands -->
  <path d="M330 300 q28 -16 58 -6" stroke="#b5762f" stroke-width="7" fill="none" stroke-linecap="round"/>
  <path d="M400 288 q30 -12 60 2" stroke="#b5762f" stroke-width="7" fill="none" stroke-linecap="round"/>
  <path d="M350 344 q40 14 84 2" stroke="#c98a3c" stroke-width="7" fill="none" stroke-linecap="round"/>
  <!-- saffron patches -->
  <ellipse cx="366" cy="322" rx="26" ry="17" fill="#f0a93c" opacity="0.55"/>
  <ellipse cx="440" cy="336" rx="22" ry="14" fill="#e8912c" opacity="0.5"/>
  <ellipse cx="372" cy="296" rx="9" ry="4.95" fill="#2f7d32" opacity="0.85"/><ellipse cx="424" cy="306" rx="8" ry="4.4" fill="#2f7d32" opacity="0.85"/><ellipse cx="398" cy="350" rx="9" ry="4.95" fill="#2f7d32" opacity="0.85"/><ellipse cx="348" cy="328" rx="7" ry="3.8500000000000005" fill="#2f7d32" opacity="0.85"/><ellipse cx="452" cy="316" rx="7" ry="3.8500000000000005" fill="#2f7d32" opacity="0.85"/>

  <!-- four shared bowls around the platter -->
  
  <ellipse cx="212" cy="256.72" rx="56" ry="45.919999999999995" fill="#ffffff"/>
  <ellipse cx="212" cy="250" rx="43.68" ry="34.72" fill="#c0402c"/>
  <ellipse cx="199.68" cy="241.04" rx="13.44" ry="7.840000000000001" fill="#ffffff" opacity="0.22"/>
  
  <ellipse cx="588" cy="256.72" rx="56" ry="45.919999999999995" fill="#ffffff"/>
  <ellipse cx="588" cy="250" rx="43.68" ry="34.72" fill="#e8a33a"/>
  <ellipse cx="575.68" cy="241.04" rx="13.44" ry="7.840000000000001" fill="#ffffff" opacity="0.22"/>
  
  <ellipse cx="212" cy="426.72" rx="56" ry="45.919999999999995" fill="#ffffff"/>
  <ellipse cx="212" cy="420" rx="43.68" ry="34.72" fill="#3f7d3a"/>
  <ellipse cx="199.68" cy="411.04" rx="13.44" ry="7.840000000000001" fill="#ffffff" opacity="0.22"/>
  
  <ellipse cx="588" cy="426.72" rx="56" ry="45.919999999999995" fill="#ffffff"/>
  <ellipse cx="588" cy="420" rx="43.68" ry="34.72" fill="#f3ece0"/>
  <ellipse cx="575.68" cy="411.04" rx="13.44" ry="7.840000000000001" fill="#ffffff" opacity="0.22"/>
</g>

<!-- "family / sharing" mark: four place settings implied by stacked plates -->
<g opacity="0.9">
  <circle cx="400" cy="118" r="34" fill="#2563eb"/>
  <circle cx="400" cy="107" r="11" fill="#ffffff"/>
  <path d="M383 134 c0 -11 8 -18 17 -18 c9 0 17 7 17 18 z" fill="#ffffff"/>
