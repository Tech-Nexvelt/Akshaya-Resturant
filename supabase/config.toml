# Supabase Project Configuration for Akshaya Restaurant Platform
project_id = "akshaya-restaurant"

[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["https://akshayarestaurant.in"]
jwt_expiry = 3600
enable_signup = false # Public signup disabled; admin creates accounts

[auth.email]
enable_signup = false
double_confirm_changes = true
enable_confirmations = true
